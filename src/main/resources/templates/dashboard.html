<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <main class="dashboard container-fluid py-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h2 class="mb-0">Dashboard administrativo</h2>
                <div class="d-flex align-items-center gap-2">
                    <small id="ultima-atualizacao" class="text-muted"></small>
                    <button id="atualizar" type="button" class="btn btn-outline-primary btn-sm">
                        <span id="carregando" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
            </div>

            <form id="filtros" class="card card-body mb-3">
                <div class="row g-2">
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2">
                        <label for="inicio" class="form-label">Início</label>
                        <input type="date" id="inicio" name="inicio" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2">
                        <label for="fim" class="form-label">Fim</label>
                        <input type="date" id="fim" name="fim" class="form-control">
                    </div>
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2">
                        <label for="status" class="form-label">Status</label>
                        <select id="status" name="status" class="form-select">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select id="tipo" name="tipo" class="form-select">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2">
                        <label for="tecnico" class="form-label">Técnico</label>
                        <select id="tecnico" name="tecnico" class="form-select">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2">
                        <label for="agrupamento" class="form-label">Agrupar por</label>
                        <select id="agrupamento" name="agrupamento" class="form-select">
                            <option value="DIA">Dia</option>
                            <option value="MES">Mês</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button id="limpar" type="button" class="btn btn-outline-secondary">Limpar filtros</button>
                    <button type="submit" class="btn btn-primary">Aplicar</button>
                </div>
            </form>

            <div id="mensagem-erro" class="alert alert-danger d-none" role="alert"></div>
            <div id="mensagem-vazio" class="alert alert-info d-none" role="status">
                Nenhum chamado encontrado para os filtros selecionados.
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6 col-md-4 col-xl-2">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="text-muted small">Total de chamados</div>
                            <div class="fs-3 fw-semibold" data-indicador="total">-</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="text-muted small">Abertos</div>
                            <div class="fs-3 fw-semibold" data-indicador="abertos">-</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="text-muted small">Em andamento</div>
                            <div class="fs-3 fw-semibold" data-indicador="emAndamento">-</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="text-muted small">Concluídos</div>
                            <div class="fs-3 fw-semibold" data-indicador="concluidos">-</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="text-muted small">Cancelados</div>
                            <div class="fs-3 fw-semibold" data-indicador="cancelados">-</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="text-muted small">Tempo médio de resolução</div>
                            <div class="fs-3 fw-semibold" data-indicador="tempoMedioResolucaoHoras">-</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Chamados abertos e concluídos por período</h5>
                            <div class="grafico">
                                <canvas id="grafico-periodo" role="img" aria-label="Chamados abertos e concluídos por período"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">Situação dos chamados</h5>
                            <div class="grafico grafico-rosca">
                                <canvas id="grafico-status" role="img" aria-label="Situação dos chamados"></canvas>
                            </div>
                            <ul id="legenda-status" class="legenda-status"></ul>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">Tipos de chamado mais atendidos</h5>
                            <div class="grafico">
                                <canvas id="grafico-tipos" role="img" aria-label="Tipos de chamado mais atendidos"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
        <script th:src="@{/js/dashboard.js}"></script>
    </body>
</html>
